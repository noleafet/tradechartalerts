[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=app

[program:api]
command=gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers %(ENV_WEB_CONCURRENCY)s --access-logfile - --error-logfile -
directory=/app
user=app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:alert-cron]
command=python manage.py run_alerts
directory=/app
user=app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true